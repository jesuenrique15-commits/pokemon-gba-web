<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Prueba GBA Online</title>
  <style>
    body {
      margin: 0;
      background: #151515;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    #game {
      width: 100%;
      height: 90vh;
      min-height: 400px;
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <script>
    window.EJS_player = "#game";
    window.EJS_core = "gba";
    window.EJS_gameName = "Prueba GBA";
    window.EJS_gameUrl = "../../roms/prueba.gba";
    window.EJS_pathtodata =
      "https://cdn.emulatorjs.org/stable/data/";
    window.EJS_startOnLoaded = false;
  </script>

  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
